name: Deploy to GitHub Pages

# The site is a Vite app, so Pages cannot serve the repository directly: it has
# to be built first and the contents of dist/ published. vite.config.ts sets the
# base path to /rise-of-ages/ for builds, which is what makes asset URLs resolve
# under the project subpath Pages serves from.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them and drop superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc runs as part of this, so a type error fails the deploy rather than
      # shipping a broken build.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
